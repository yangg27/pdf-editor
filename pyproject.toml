[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-editor"
version = "0.2.0"
description = "本地桌面 PDF 编辑器 MVP"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24.0",
    "pypdf>=4.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
